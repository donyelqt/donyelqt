name: refresh 3d commit graph

on:
  schedule:
    - cron: "17 4 * * *"      # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [".github/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node generate-commits-3d.mjs
      - name: commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/commits-3d.svg
          git diff --cached --quiet || git commit -m "chore: refresh 3d commit graph"
          git push
